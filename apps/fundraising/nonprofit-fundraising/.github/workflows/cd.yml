# Inactive reference template; not approval to enable client deployment.
name: CD

on:
  workflow_dispatch:
    inputs:
      api-url:
        description: Reviewed target workspace URL
        required: true
        type: string

permissions:
  contents: read

env:
  TWENTY_CLI_VERSION: '2.49.0'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: twentyhq/twenty/.github/actions/deploy-twenty-app@06a5c6bc4c7c8291c980aa2358e6c48d88fa0733
        with:
          cli-version: ${{ env.TWENTY_CLI_VERSION }}
          api-url: ${{ inputs.api-url }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}

      - name: Install
        uses: twentyhq/twenty/.github/actions/install-twenty-app@06a5c6bc4c7c8291c980aa2358e6c48d88fa0733
        with:
          cli-version: ${{ env.TWENTY_CLI_VERSION }}
          api-url: ${{ inputs.api-url }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
